services:
  - type: web
    name: stremio-musor-tv
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 7000
      - key: TZ
        value: Europe/Budapest
      - key: LOG_LEVEL
        value: info
      - key: CACHE_TTL_MIN
        value: 10
      - key: SCRAPE_RATE_MS
        value: 30000
      - key: IMDB_LOOKUP_ENABLED
        value: true
      - key: IMDB_CACHE_TTL_DAYS
        value: 7
      - key: IMDB_RATE_LIMIT_PER_SEC
        value: 40
      - key: TMDB_API_KEY
        sync: false
    plan: free
