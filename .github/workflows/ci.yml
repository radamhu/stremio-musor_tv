name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        env:
          PYTHONPATH: src
          TZ: Europe/Budapest
          IMDB_LOOKUP_ENABLED: "false"
        run: |
          python -m pytest tests/ -q \
            --ignore=tests/test_stream_support.py \
            --ignore=tests/test_stream_endpoint.py

  docker-build:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t stremio-musor-tv:ci .

  notify-discord:
    name: Notify Discord
    needs:
      - tests
      - docker-build
    if: |
      always() &&
      secrets.DISCORD_WEBHOOK_URL != '' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Send CI status to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          TESTS_RESULT: ${{ needs.tests.result }}
          DOCKER_RESULT: ${{ needs.docker-build.result }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          tests_result = os.environ["TESTS_RESULT"]
          docker_result = os.environ["DOCKER_RESULT"]
          success = tests_result == "success" and docker_result == "success"
          status = "SUCCESS" if success else "FAILED"
          emoji = "✅" if success else "❌"
          run_url = f"https://github.com/{os.environ['REPOSITORY']}/actions/runs/{os.environ['RUN_ID']}"

          content = (
              f"{emoji} CI {status} for {os.environ['REPOSITORY']}\n"
              f"Branch: {os.environ['REF_NAME']}\n"
              f"Event: {os.environ['EVENT_NAME']}\n"
              f"Actor: {os.environ['ACTOR']}\n"
              f"Tests: {tests_result}\n"
              f"Docker build: {docker_result}\n"
              f"Run: {run_url}"
          )

          req = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=json.dumps({"content": content}).encode("utf-8"),
              headers={"Content-Type": "application/json"},
          )
          urllib.request.urlopen(req).read()
          PY
